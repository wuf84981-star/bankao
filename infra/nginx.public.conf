# ============================================================
# 伴考 · 大门值班手册（公网演示版 · 云服务器专用）
# 与本地 nginx.conf 的三处不同：
# ① TLS：8443 自签证书，80 只做跳转（无备案域名的国内云 IP 直连唯一活路）；
# ② 限流：认证面 15 次/分/IP（防爆破与邮箱轰炸），其余 API 20 次/秒/IP；
# ③ 侧门（5432/8000/6099）由 docker-compose.cloud.yml 关闭，本文件只管大门。
# 本地版的好件全部继承：SPA 兜底、no-cache+ETag、50m 上传、SSE 耐心 300s。
#
# 证书自造（云服务器项目根跑一次，SAN 填你的公网 IP）：
#   mkdir -p data/certs && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 \
#     -keyout data/certs/bankao.key -out data/certs/bankao.crt -days 825 -nodes \
#     -subj "/CN=bankao-demo" -addext "subjectAltName=IP:1.2.3.4"
#
# 备案转正时改三行：listen 8443 → 443；证书两行 → certbot --nginx 接管；
# 80 跳转 → return 307 https://$host$request_uri（去掉 :8443）。
# ============================================================

# 计次闸（conf.d 文件整体 include 在 http context，zone 定义放这里合法）
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=15r/m;

server {
    listen 80;
    # 明文来客一律请去 HTTPS（简历上直接印 https://IP:8443，此段是防手滑兜底）
    location / {
        return 307 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bankao.crt;
    ssl_certificate_key /etc/nginx/certs/bankao.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 公网体面：响应压缩（SSE 的 text/event-stream 不在 types 名单，天然豁免不缓冲成灾）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ① 静态页：与本地版同款（SPA 兜底 + no-cache 回源对暗号）
    #    add_header 不跨层继承，故本 location 重列安全头
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # ② 认证面：机器爆破与验证码轰炸的靶心，闸最紧
    location ~ ^/api/(login|register|reset) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }

    # ③ 其余 API：聊天/SSE/资料上传等
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
        # SSE 静默耐心（本地断线案同款药）：模型思考期间线上零字节，300s 给足开口前的耐心
        proxy_read_timeout 300s;
    }
}
