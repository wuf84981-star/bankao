# ============================================================
# 伴考 · 大门值班手册（Nginx 配置）
# 职责两条：① 静态页——来要页面的，把 dist 里的货递出去
#           ② API 转发——来要数据的，把请求转交给后端箱
# 一个 80 端口，前后端并成"同源"，跨域门卫从此下岗。
# ============================================================
server {
    listen 80;

    # ① 静态页：React 打包产物（dist 挂进来）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 兜底：找不到实体文件的地址（如 /chat）一律交 index.html，
        # 由前端路由自己演——刷新子页面不再 404
        try_files $uri $uri/ /index.html;
        # 换 bundle 病的永久药（2026-09-10 真机案：Docker 已递新货、浏览器抱旧
        # index.html 不放，普通刷新救不回）：静态应答一律 no-cache——
        # 浏览器每次拿 ETag/Last-Modified 回源对暗号，货没变回 304 不重发，
        # 变了立刻换新。前端"没同步"从此只剩真没构建这一种可能。
        add_header Cache-Control "no-cache";
    }

    # ② API 转发：/api 开头的全部转交给后端箱（底盘内网凭服务名相认）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 上传放行尺寸：Nginx 默认只放过 1MB 的包裹，真题 PDF 动辄几 MB
        # 会吃闷 413（S3 解析刀断言现场逮到）。对齐 PRD F-19 上限放到 50m，
        # 让后端的 50MB 护栏当第一责任人。
        client_max_body_size 50m;
        # SSE 静默耐心（2026-09-12 断线案）：流式腿「第一个可见字才让 socket 动」，
        # 模型思考+工具轮次期间线上零字节，nginx 默认只等 60s 就拔线——浏览器
        # 拿到断流报网络错误，前端误译成「连不上后端」。放到 300s 给开口前买耐心；
        # 真死透的兜底另有后端 llm timeout=60 + 前端心跳帧双闸。
        proxy_read_timeout 300s;
    }
}
